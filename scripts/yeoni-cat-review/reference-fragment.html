<div id="yeoni-cat-reference-v2">
  <style>
    #yeoni-cat-reference-v2 { color:var(--foreground); @@IMAGE_VARS@@ }
    #yeoni-cat-reference-v2 .reference-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    #yeoni-cat-reference-v2 figure { margin:0; min-width:0; }
    #yeoni-cat-reference-v2 figcaption { font-weight:500; margin-bottom:8px; }
    #yeoni-cat-reference-v2 .reference-stage { position:relative; width:100%; aspect-ratio:1; overflow:hidden; }
    #yeoni-cat-reference-v2 .reference-portrait { position:absolute; inset:0; width:100%; height:100%; }
    #yeoni-cat-reference-v2 .reference-base, #yeoni-cat-reference-v2 .reference-overlay { position:absolute; inset:0; background-image:var(--reference-base); background-size:100% 100%; }
    #yeoni-cat-reference-v2 .reference-patch { position:absolute; background-size:100% 100%; display:none; }
    #yeoni-cat-reference-v2 .reference-overlay { display:none; opacity:.5; }
    #yeoni-cat-reference-v2:has(#reference-overlay:checked) .reference-overlay { display:block; }
    #yeoni-cat-reference-v2:has(#reference-zoom:checked) .reference-stage { aspect-ratio:180/110; }
    #yeoni-cat-reference-v2:has(#reference-zoom:checked) .reference-portrait { width:173.888888889%; height:284.545454545%; left:-33.333333333%; top:-90.909090909%; }
    #yeoni-cat-reference-v2 fieldset { border:0; padding:0; margin:16px 0 0; min-width:0; }
    #yeoni-cat-reference-v2 legend { font-weight:500; margin-bottom:6px; }
    #yeoni-cat-reference-v2 .reference-options, #yeoni-cat-reference-v2 .reference-view { display:flex; flex-wrap:wrap; gap:8px 16px; }
    #yeoni-cat-reference-v2 .reference-view { margin-bottom:12px; }
    @@SELECTION_CSS@@
    @media(max-width:540px) { #yeoni-cat-reference-v2 .reference-grid { grid-template-columns:minmax(0,1fr); } }
  </style>
  <div class="reference-view">
    <label class="form-check"><input id="reference-zoom" type="checkbox" class="form-check-input"><span class="form-check-label">얼굴 확대</span></label>
    <label class="form-check"><input id="reference-overlay" type="checkbox" class="form-check-input"><span class="form-check-label">수정본에 원본 겹치기</span></label>
  </div>
  <div class="reference-grid">
    <figure><figcaption>공식 고양이 원본</figcaption><div class="reference-stage original" role="img" aria-label="공식 고양이 원본 첫 번째 자세"><div class="reference-portrait"><div class="reference-base"></div></div></div></figure>
    <figure><figcaption>원본 보존 수정본</figcaption><div class="reference-stage revised" role="img" aria-label="원본의 얼굴, 몸, 꼬리를 유지하고 선택한 눈과 입만 표시한 고양이"><div class="reference-portrait"><div class="reference-base"></div>@@PATCHES@@<div class="reference-overlay"></div></div></div></figure>
  </div>
  <fieldset><legend>수정본 눈</legend><div class="reference-options">
    <label class="form-check"><input id="reference-eye-open" name="cat-reference-eye" type="radio" class="form-check-input" checked><span class="form-check-label">뜸</span></label>
    <label class="form-check"><input id="reference-eye-eyesHalf" name="cat-reference-eye" type="radio" class="form-check-input"><span class="form-check-label">반쯤 감음</span></label>
    <label class="form-check"><input id="reference-eye-eyesClosed" name="cat-reference-eye" type="radio" class="form-check-input"><span class="form-check-label">눈웃음</span></label>
  </div></fieldset>
  <fieldset><legend>수정본 입</legend><div class="reference-options">@@MOUTH_OPTIONS@@</div></fieldset>
</div>
