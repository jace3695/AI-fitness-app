<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#bd530c"/></marker></defs><g transform="translate(0,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D09 1번 예제 · 1 / 5</text><circle cx="200" cy="65" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">눈과 부리는 잠시 보지 않을 거예요. 「원본 </text><text x="15" y="424" font-family="sans-serif" font-size="16">숨기기」를 누르고 몸 위쪽 점만 짚어요.</text></g><g transform="translate(400,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D09 1번 예제 · 2 / 5</text><path d="M 200 65 C 132 65 76 142 76 220 C 76 294 109 317 200 317" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="65" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 65 L179 67" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">위에서 왼쪽으로 크게 돌아 아래까지 따라가요.</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 눈은 아직 넣지 않아요.</text></g><g transform="translate(800,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D09 1번 예제 · 3 / 5</text><path d="M 200 65 C 132 65 76 142 76 220 C 76 294 109 317 200 317" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 200 65 C 268 65 324 142 324 220 C 324 294 291 317 200 317" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="65" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 65 L221 67" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">다시 위에서 오른쪽