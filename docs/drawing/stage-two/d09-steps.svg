t-size="16">치기」를 켜요. 큰 달걀이 몸의 자리에 있는지</text><text x="15" y="448" font-family="sans-serif" font-size="16"> 보고 다시 겹치기를 꺼요.</text></g><g transform="translate(400,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D09 1번 예제 · 5 / 5</text><path d="M 149.5 152 A 6.5 6.5 0 1 0 162.5 152 A 6.5 6.5 0 1 0 149.5 152" fill="#7750c4" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="156" cy="152" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M 237.5 152 A 6.5 6.5 0 1 0 250.5 152 A 6.5 6.5 0 1 0 237.5 152" fill="#7750c4" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="244" cy="152" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M 200 65 C 132 65 76 142 76 220 C 76 294 109 317 200 317" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 200 65 C 268 65 324 142 324 220 C 324 294 291 317 200 317" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="15" y="400" font-family="sans-serif" font-size="16">마지막으로 눈 두 점만 넣어요. 부리와 날개는</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 오늘 그리지 않아도 돼요.</text></g><g transform="translate(0,1120)"><text x="15" y="22" font-family="sans-serif" font-size="18">D09 2번 예제 · 1 / 5</text><circle cx="200" cy="74" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">눈과 부리는 잠시 보지 않을 거예요. 「원본 </text><text x="15" y="424" font-family="sans-serif" font-size="16">숨기기」를 누르고 몸 위쪽 점만 짚어요.</text></g><g transform="translate(400,1120)"><text x="15" y="22" font-family="sans-serif" font-size="18">D09 2번 예제 · 2 / 5</text><path d="M 200 74 C 122 74 69 153 74 228 C 78 294 119 317 200 317" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="74" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/>