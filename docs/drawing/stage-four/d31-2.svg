y="22" font-family="sans-serif" font-size="16">기억할 특징 선택</text><text x="12" y="100" font-family="sans-serif" font-size="16">위로 긴 귀</text><text x="12" y="150" font-family="sans-serif" font-size="16">아래쪽 둥근 얼굴</text><text x="12" y="200" font-family="sans-serif" font-size="16">얼굴 안 점 눈</text><text x="12" y="330" font-family="sans-serif" font-size="16">가린 단계: 원본·세부 시범 없음</text></g><g transform="translate(0 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">1/5 · observe</text><g transform="translate(10 45)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="짧은 귀 토끼"><defs><marker id="arrow-_s0R_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M200 142 C139.247 142 90 181.398 90 230 C90 278.602 139.247 318 200 318" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M200 142 C260.753 142 310 181.398 310 230 C310 278.602 260.753 318 200 318" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M126 165 C111 131 113 97 135 96 C156 94 162 115 176 145" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M224 145 C238 115 244 94 265 96 C287 97 289 131 274 165" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M156 234 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M234 234 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M194 255 Q200 261 206 255" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></g></svg></g><text x="12" y="445" font-family="sans-serif" font-size="16">귀 길이·얼굴 모양·눈 중 기억할 두 가지를</text><text x="12" y="468" font-family="sans-serif" font-size="16"> 골라요. 긴 귀가 얼굴 위 어디에 붙는지도</text><text x="12" y="491" font-family="sans-serif" font-size="16"> 봐요.</text></g><g transform="translate(400 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">2/5 · recall</text><g transform="translate(10 45)"><rect width="380" height="370" rx="20" fill="#f6f4fb" stroke="#c8c0d6"/><text x="12" y="180" font-family="sans-serif" font-size="16">원본 숨김 · 기억해서 그리는 빈 자리</text></g><text x="12" y="445" font-family="sans-serif" font-size="16">원본을 가렸어요. 내가 고른 두 가지를 떠올</text><text x="12" y="468" font-family="sans-serif" font-size="16">려 말하거나 적어요.</text></g><g transform="translate(800 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">3/5 · recall</text><g transform="translate(10 45)"><rect width="380" height="370" rx="20" fill="#f6f4fb" stroke="#c8c0d6"/><text x="12" y="180" font-family="sans-serif" font-size="16">원본 숨김 · 기억해서 그리는 빈 자리</text></g><text x="12" y="445" font-family="sans-serif" font-size="16">고른 특징을 중심으로 토끼를 그려요. 귀 길</text><text x="12" y="468" font-family="sans-serif" font-size="16">이와 얼굴 모양을 골랐다면 귀와 얼굴만 그려</text><text x="12" y="491" font-family="sans-serif" font-size="16">도 돼요.</text></g><g transform="translate(0 1130)"><text x="12" y="22" font-family="sans-serif" font-size="16">4/5 · compare</text><g transform="translate(10 45)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="짧은 귀 토끼"><defs><marker id="arrow-_s3R_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M200 142 C139.247 142 90 181.398 90 230 C90 278.602 139.247 318 200 318" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M200 142 C260.753 142 310 181.398 310 230 C310 278