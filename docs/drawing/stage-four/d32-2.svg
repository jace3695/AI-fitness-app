<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740"><rect width="100%" height="100%" fill="white"/><text x="12" y="22" font-family="sans-serif" font-size="16">D32 · 통통한 콩 친구 · 관찰 원본</text><g transform="translate(10 55)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="통통한 콩 친구"><defs><marker id="arrow-_refR_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M195 100 C286 78 338 148 319 225 C304 285 245 314 180 302" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M180 302 C114 290 76 239 100 205 C124 180 138 163 127 144 C115 121 154 100 195 100" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M193 214 Q200 220 207 214" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></g></svg></g><g transform="translate(400 0)"><text x="12" y="22" font-family="sans-serif" font-size="16">더 쉽게 · 기본 힌트</text><g transform="translate(10 55)"></g><text x="12" y="445" font-family="sans-serif" font-size="16">가리기를 취소하고 모작으로 마무리한다. 실패</text><text x="12" y="468" font-family="sans-serif" font-size="16">로 기록하지 않는다.</text></g><g transform="translate(800 0)"><text x="12" y="22" font-family="sans-serif" font-size="16">기억할 특징 선택</text><text x="12" y="100" font-family="sans-serif" font-size="16">콩처럼 휜 몸</text><text x="12" y="150" font-family="sans-serif" font-size="16">점 눈 두 개</text><text x="12" y="200" font-family="sans-serif" font-size="16">짧은 입</text><text x="12" y="330" font-family="sans-serif" font-size="16">가린 단계: 원본·세부 시범 없음</text></g><g transform="translate(0 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">1/5 · observe</text><g transform="translate(10 45)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="통통한 콩 친구"><defs><marker id="arrow-_s0R_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M195 100 C286 78 338 148 319 225 C304 285 245 314 180 302" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M180 302 C114 290 76 239 100 205 C124 180 138 163 127 144 C115 121 154 100 195 100" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M193 214 Q200 220 207 214" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></g></svg></g><text x="12" y="445" font-family="sans-serif" font-size="16">콩 캐릭터의 휜 몸과 점 눈·짧은 입을 봐요</text><text x="12" y="468" font-family="sans-serif" font-size="16">. 기억할 특징 두 개를 골라요.</text></g><g transform="translate(400 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">2/5 · recall</text><g transform="translate(10 45)"><rect width="380" height="370" rx="20" fill="#f6f4fb" stroke="#c8c0d6"/><text x="12" y="180" font-family="sans-serif" font-size="16">원본 숨김 · 기억해서 그리는 빈 자리</text></g><text x="12" y="445" font-family="sans-serif" font-size="16">원본을 가렸어요. 떠오르는 특징부터 말하거나</text><text x="12" y="468" font-family="sans-serif" font-size="16"> 적어요.</text></g><g transform="translate(800 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">3/5 · recall</text><g transform="translate(10 45)"><rect width="380" height="370" rx="20" fill="#f6f4fb" stroke="#c8c0d6"/><text x="12" y="180" font-family="sans-serif" font-size="16">원본 숨김 · 기억해서 그리는 빈 자리</text></g><text x="12" y="445" font-family="sans-serif" font-size="16">기억나는 데까지 그려요. 막힌 부분을 정한 </text><text x="12" y="468" font-family="sans-serif" font-size="16">뒤 ‘잠깐 원본 확인’을 눌러 보고 다시 가</text><text x="12" y="491" font-family="sans-serif" font-size="16">려 이어 그려요.</text></g><g transform="translate(0 1130)"><text x="12" y="22" font-family="sans-serif" font-size="16">4/5 · compare</text><g transform="translate(10 45)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="통통한 콩 친구"><defs><marker id="arrow-_s3R_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M195 100 C286 78 338 148 319 225 C304 285 245 314 180 302" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M180 302 C114 290 76 239 100 205 C124 180 138 163 127 144 C115 121 154 100 195 100" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M193 214 Q200 220 207 214" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></g></svg></g><text x="12" y="445" font-family="sans-serif" font-size="16">원본을 다시 열고 무엇을 다시 봤는지 적어요</text><text x="12" y="468" font-family="sans-serif" font-size="16">. 다시 확인한 것은 실패가 아니에요.</text></g><g transform="translate(400 1130)"><text x="12" y="22" font-family="sans-serif" font-size="16">5/5 · compare</text><g transform="translate(10 45)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="통통한 콩 친구"><defs><marker id="arrow-_s4R_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M195 100 C286 78 338 148 319 225 C304 285 245 314 180 302" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M180 302 C114 290 76 239 100 205 C124 180 138 163 127 144 C115 121 154 100 195 100" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M193 214 Q200 220 207 214" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></g></svg></g><text x="12" y="445" font-family="sans-serif" font-size="16">다시 본 부분 하나만 보완해요. 어렵다면 원</text><text x="12" y="468" font-family="sans-serif" font-size="16">본을 옆에 두고 모작으로 마쳐도 돼요.</text></g></svg>