<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740"><rect width="100%" height="100%" fill="white"/><text x="12" y="22" font-family="sans-serif" font-size="16">D33 · 작은 귀 곰 · 관찰 원본</text><g transform="translate(10 55)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="작은 귀 곰"><defs><marker id="arrow-_refR_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M200 120 C133.724 120 80 164.77 80 220 C80 275.23 133.724 320 200 320" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M200 120 C266.276 120 320 164.77 320 220 C320 275.23 266.276 320 200 320" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M102 162 C72 131 115 95 148 130" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M252 130 C285 95 328 131 298 162" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M153 218 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M237 218 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M193 236 Q200 232 207 236 Q207 242 200 245 Q193 242 193 236" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></g></svg></g><g transform="translate(400 0)"><text x="12" y="22" font-family="sans-serif" font-size="16">더 쉽게 · 기본 힌트</text><g transform="translate(10 55)"></g><text x="12" y="445" font-family="sans-serif" font-size="16">해당 캐릭터의 작은 미리보기를 잠깐 보거나 </text><text x="12" y="468" font-family="sans-serif" font-size="16">처음부터 옆에 둔다.</text></g><g transform="translate(800 0)"><text x="12" y="22" font-family="sans-serif" font-size="16">기억할 특징 선택</text><text x="12" y="100" font-family="sans-serif" font-size="16">큰 둥근 얼굴</text><text x="12" y="150" font-family="sans-serif" font-size="16">위쪽 작은 귀</text><text x="12" y="200" font-family="sans-serif" font-size="16">얼굴 안 점 눈</text><text x="12" y="330" font-family="sans-serif" font-size="16">가린 단계: 원본·세부 시범 없음</text></g><g transform="translate(0 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">1/5 · recall</text><g transform="translate(10 45)"><rect width="380" height="370" rx="20" fill="#f6f4fb" stroke="#c8c0d6"/><text x="12" y="180" font-family="sans-serif" font-size="16">원본 숨김 · 기억해서 그리는 빈 자리</text></g><text x="12" y="445" font-family="sans-serif" font-size="16">이전에 저장한 D29~D32 그림을 이름으로</text><text x="12" y="468" font-family="sans-serif" font-size="16"> 골라요. 아직 없다면 표시된 곰으로 맛볼 </text><text x="12" y="491" font-family="sans-serif" font-size="16">수 있어요. 원본은 아직 열지 않아요.</text></g><g transform="translate(400 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">2/5 · recall</text><g transform="translate(10 45)"><rect width="380" height="370" rx="20" fill="#f6f4fb" stroke="#c8c0d6"/><text x="12" y="180" font-family="sans-serif" font-size="16">원본 숨김 · 기억해서 그리는 빈 자리</text></g><text x="12" y="445" font-family="sans-serif" font-size="16">지난번 기억한 큰 모양과 특징 두 개를 떠올</text><text x="12" y="468" font-family="sans-serif" font-size="16">려 골라요. 말하거나 적어도 돼요.</text></g><g transform="translate(800 560)"><text x="12" y="22" font-family="sans-serif" font-size="16">3/5 · recall</text><g transform="translate(10 45)"><rect width="380" height="370" rx="20" fill="#f6f4fb" stroke="#c8c0d6"/><text x="12" y="180" font-family="sans-serif" font-size="16">원본 숨김 · 기억해서 그리는 빈 자리</text></g><text x="12" y="445" font-family="sans-serif" font-size="16">원본 없이 큰 모양과 특징 두 개를 그려요.</text><text x="12" y="468" font-family="sans-serif" font-size="16"> 막히면 잠깐 확인해도 괜찮아요.</text></g><g transform="translate(0 1130)"><text x="12" y="22" font-family="sans-serif" font-size="16">4/5 · compare</text><g transform="translate(10 45)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="작은 귀 곰"><defs><marker id="arrow-_s3R_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M200 120 C133.724 120 80 164.77 80 220 C80 275.23 133.724 320 200 320" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M200 120 C266.276 120 320 164.77 320 220 C320 275.23 266.276 320 200 320" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M102 162 C72 131 115 95 148 130" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M252 130 C285 95 328 131 298 162" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M153 218 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M237 218 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M193 236 Q200 232 207 236 Q207 242 200 245 Q193 242 193 236" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></g></svg></g><text x="12" y="445" font-family="sans-serif" font-size="16">원본을 열고 기억한 부분과 다시 본 부분을 </text><text x="12" y="468" font-family="sans-serif" font-size="16">구별해 적어요. 지난 그림 원본은 바꾸지 않</text><text x="12" y="491" font-family="sans-serif" font-size="16">아요.</text></g><g transform="translate(400 1130)"><text x="12" y="22" font-family="sans-serif" font-size="16">5/5 · compare</text><g transform="translate(10 45)"><svg width="380" height="380" viewBox="0 0 400 400" class="h-full w-full" role="img" aria-label="작은 귀 곰"><defs><marker id="arrow-_s4R_0_" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#bd530c"></path></marker></defs><g><g><path d="M200 120 C133.724 120 80 164.77 80 220 C80 275.23 133.724 320 200 320" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M200 120 C266.276 120 320 164.77 320 220 C320 275.23 266.276 320 200 320" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M102 162 C72 131 115 95 148 130" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M252 130 C285 95 328 131 298 162" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M153 218 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M237 218 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g><g><path d="M193 236 Q200 232 207 236 Q207 242 200 245 Q193 242 193 236" fill="#161616" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></g></g></svg></g><text x="12" y="445" font-family="sans-serif" font-size="16">다시 확인한 부분 중 한 곳만 보완해요. 다</text><text x="12" y="468" font-family="sans-serif" font-size="16">음 연습에서 기억할 특징을 하나 정해요.</text></g></svg>