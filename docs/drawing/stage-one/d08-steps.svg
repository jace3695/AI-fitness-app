<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#bd530c"/></marker></defs><g transform="translate(0,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 1번 예제 · 1 / 6</text><circle cx="195" cy="100" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">완성 예제를 열고 가장 큰 몸을 짚어요. 내가</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 시작할 곳을 손가락으로 골라요. 주황 점은 </text><text x="15" y="448" font-family="sans-serif" font-size="16">한 가지 예시일 뿐, 다른 곳에서 시작해도 괜</text><text x="15" y="472" font-family="sans-serif" font-size="16">찮아요.</text></g><g transform="translate(400,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 1번 예제 · 2 / 6</text><path d="M195 100 C279 77 326 122 318 196 C312 270 254 309 184 300" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="195" cy="100" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M195 100 L223 94" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">고른 곳에서 몸의 배 쪽을 따라가요. 화면은 </text><text x="15" y="424" font-family="sans-serif" font-size="16">위에서 오른쪽으로 도는 예시예요. 긴 선은 쉬</text><text x="15" y="448" font-family="sans-serif" font-size="16">고 싶은 곳에서 나누어 그려요.</text></g><g transform="translate(800,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 1번 예제 · 3 / 6</text><path d="M195 100 C279 77 326 122 318 196 C312 270 254 309 184 300" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 300 C110 292 84 244 110 210 C134 183 139 163 126 145 C113 125 148 100 195 100" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="184" cy="300" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M184 300 L156 293" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">몸의 허리 쪽도 이어 그려요. 화면은 아래에서</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 왼쪽을 돌아 위로 가는 예시예요. 내가 고른</text><text x="15" y="448" font-family="sans-serif" font-size="16"> 시작점으로 돌아와 닫아요.</text></g><g transform="translate(0,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 1번 예제 · 4 / 6</text><path d="M195 100 C279 77 326 122 318 196 C312 270 254 309 184 300" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 300 C110 292 84 244 110 210 C134 183 139 163 126 145 C113 125 148 100 195 100" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#7750c4" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170" cy="191" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#7750c4" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="191" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">몸을 그린 뒤 점 눈 두 개를 넣어요.</text></g><g transform="translate(400,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 1번 예제 · 5 / 6</text><path d="M195 100 C279 77 326 122 318 196 C312 270 254 309 184 300" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 300 C110 292 84 244 110 210 C134 183 139 163 126 145 C113 125 148 100 195 100" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#c5c1cf" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#c5c1cf" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M193 214 Q200 220 207 214" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="193" cy="214" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M193 214 L200 220" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">눈 아래에 짧은 입을 넣어요. 눈부터 시작하지</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 않고 큰 몸을 먼저 그렸는지 떠올려요.</text></g><g transform="translate(800,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 1번 예제 · 6 / 6</text><path d="M195 100 C279 77 326 122 318 196 C312 270 254 309 184 300" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 300 C110 292 84 244 110 210 C134 183 139 163 126 145 C113 125 148 100 195 100" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#c5c1cf" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#c5c1cf" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M193 214 Q200 220 207 214" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="15" y="400" font-family="sans-serif" font-size="16">「원본 숨기기」를 눌러요. 앱에서는 「밑그림 </text><text x="15" y="424" font-family="sans-serif" font-size="16">숨기기」도 눌러요. 종이 예제는 덮어 둬요. </text><text x="15" y="448" font-family="sans-serif" font-size="16">어려웠던 선 하나와 처음 고른 시작 위치를 아</text><text x="15" y="472" font-family="sans-serif" font-size="16">래 「남기고 싶은 말」에 적어요.</text></g><g transform="translate(0,1120)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 2번 예제 · 1 / 6</text><circle cx="195" cy="100" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">완성 예제를 열고 가장 큰 몸을 짚어요. 내가</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 시작할 곳을 손가락으로 골라요. 주황 점은 </text><text x="15" y="448" font-family="sans-serif" font-size="16">한 가지 예시일 뿐, 다른 곳에서 시작해도 괜</text><text x="15" y="472" font-family="sans-serif" font-size="16">찮아요.</text></g><g transform="translate(400,1120)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 2번 예제 · 2 / 6</text><path d="M195 100 C286 78 338 148 319 225 C304 285 245 314 180 302" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="195" cy="100" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M195 100 L223 94" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">고른 곳에서 몸의 배 쪽을 따라가요. 화면은 </text><text x="15" y="424" font-family="sans-serif" font-size="16">위에서 오른쪽으로 도는 예시예요. 긴 선은 쉬</text><text x="15" y="448" font-family="sans-serif" font-size="16">고 싶은 곳에서 나누어 그려요.</text></g><g transform="translate(800,1120)"><text x="15" y="22" font-family="sans-serif" font-size="18">D08 2번 예제 · 3 / 6</text><path d="M195 100 C286 78 338 148 319 225 C304 285 245 314 180 302" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 302 C114 290 76 239 100 205 C124 180 138 163 127 144 C115 121 154 100 195 100" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="302" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M180 302 L152 295" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family