<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#bd530c"/></marker></defs><g transform="translate(0,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D02 1번 예제 · 1 / 5</text><circle cx="200" cy="95" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">완성 예제를 열고 오른쪽의 볼록한 배와 왼쪽의</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 쏙 들어간 허리를 손가락으로 짚어요. 아직 </text><text x="15" y="448" font-family="sans-serif" font-size="16">그리지 않아요.</text></g><g transform="translate(400,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D02 1번 예제 · 2 / 5</text><path d="M200 95 C280 77 335 133 318 214 C304 283 239 327 169 310" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="95" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 95 L228 89" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">위쪽 점에서 오른쪽으로 출발해요. 볼록한 배를</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 크게 돌아 아래쪽까지 내려와요. 길면 중간에</text><text x="15" y="448" font-family="sans-serif" font-size="16"> 쉬어도 돼요.</text></g><g transform="translate(800,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D02 1번 예제 · 3 / 5</text><path d="M200 95 C280 77 335 133 318 214 C304 283 239 327 169 310" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M169 310 C90 291 85 234 124 208 C164 183 166 160 147 140 C121 113 153 95 200 95" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="169" cy="310" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M169 310 L141 303" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">아래쪽 점에서 왼쪽으로 가요. 왼쪽 허리가 안</text><text x="15" y="424" font-family="sans-serif" font-size="16">으로 휘는 곳을 지나 위의 시작점까지 이어요.</text></g><g transform="translate(0,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D02 1번 예제 · 4 / 5</text><path d="M200 95 C280 77 335 133 318 214 C304 283 239 327 169 310" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M169 310 C90 291 85 234 124 208 C164 183 166 160 147 140 C121 113 153 95 200 95" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#7750c4" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170" cy="191" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#7750c4" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="191" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">연필을 떼고 왼쪽 눈, 오른쪽 눈에 작은 점을</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 찍어요.</text></g><g transform="translate(400,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D02 1번 예제 · 5 / 5</text><path d="M200 95 C280 77 335 133 318 214 C304 283 239 327 169 310" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M169 310 C90 291 85 234 124 208 C164 183 166 160 147 140 C121 113 153 95 200 95" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M165 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#c5c1cf" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 191 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0" fill="#c5c1cf" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M193 214 Q200 220 207 214" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="193" cy="214" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M193 214 L200 220" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">두 눈 사이의 아래에서 짧게 웃는 입을 그려요</text><text x="15" y="424" font-family="sans-serif" font-size="16">. 오른쪽 배와 왼쪽 허리를 다시 비교해요.</text></g><g transform="translate(0,1120)"><text x="15" y="22" font-family="sans-serif" font-size="18">D02 2번 예제 · 1 / 5</text><circle cx="200" cy="95" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">완성 예제를 열고 오른쪽의 볼록한 배와 왼쪽의</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 쏙 들어간 허리를 손가락으로 짚어요. 아직 </text><text x="15" y="448" font-family="sans-serif" font-size="16">그리지 않아요.</text></g><g transform="translate(400,1120)"><text x="15" y="22" font-family="sans-serif" font-size="18">D02 2번 예제 · 2 / 5</text><path d="M200 95 C280 77 335 133 318 214 C304 283 239 327 169 310" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="95" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 95 L228 89" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">위쪽 점에서 오른쪽으로 출발해요. 볼록한 배를</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 크게 돌아 아래쪽까지 내려와요. 길면 중간에</text><text x="15" y="448" font-family="sans-serif" font-size="16"> 쉬어도 돼요.</text></g><g transform="translate(800,1120)"><text x="15" y="22" font-family="sans-serif" font-size="18">D02 2번 예제 · 3 / 5</text><path d="M200 95 C280 77 335 133 318 214 