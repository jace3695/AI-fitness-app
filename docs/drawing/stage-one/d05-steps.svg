<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#bd530c"/></marker></defs><g transform="translate(0,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D05 1번 예제 · 1 / 6</text><circle cx="130" cy="105" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">완성 예제에서 곧은 부분과 둥근 모서리를 찾아</text><text x="15" y="424" font-family="sans-serif" font-size="16">요. 위쪽 가로선의 왼쪽 점을 짚어요.</text></g><g transform="translate(400,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D05 1번 예제 · 2 / 6</text><path d="M130 105 H270" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="105" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M130 105 L158 105" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">위쪽 선을 왼쪽에서 오른쪽으로 그어요.</text></g><g transform="translate(800,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D05 1번 예제 · 3 / 6</text><path d="M130 105 H270" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 105 Q305 105 305 140 V285" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="105" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M270 105 L294 105" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">이어서 오른쪽 위 모서리를 천천히 돌아 아래로</text><text x="15" y="424" font-family="sans-serif" font-size="16"> 내려와요.</text></g><g transform="translate(0,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D05