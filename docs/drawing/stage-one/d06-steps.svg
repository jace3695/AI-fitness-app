<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#bd530c"/></marker></defs><g transform="translate(0,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D06 1번 예제 · 1 / 6</text><circle cx="200" cy="72" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">몸의 바깥 선과 안쪽 배를 찾아요. 몸 맨 위</text><text x="15" y="424" font-family="sans-serif" font-size="16">의 점에서 시작해요.</text></g><g transform="translate(400,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D06 1번 예제 · 2 / 6</text><path d="M200 72 C135 72 100 169 100 258 C100 310 136 330 200 330" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="72" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 72 L172 72" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">몸 위에서 왼쪽으로 돌아 아래까지 따라가요.</text></g><g transform="translate(800,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D06 1번 예제 · 3 / 6</text><path d="M200 72 C135 72 100 169 100 258 C100 310 136 330 200 330" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 72 C265 72 300 169 300 258 C300 310 264 330 200 330" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="72" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 72 L228 72" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">연필을 떼고 몸 위로 돌아와요. 오른쪽 반을 </text><text x="15" y="424" font-family="sans-serif" font-size="16">그려 아래에서 만나요.</text></g><g transform="translate(0,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D06 1번 예제 · 4 / 6</text><path d="M200 72 C135 72 100 169 100 258 C100 310 136 330 200 330" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 72 C265 72 300 169 300 258 C300 310 264 330 200 330" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="190" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">연필을 종이에서 떼고 안쪽 배의 위쪽 점으로 </text><text x="15" y="424" font-family="sans-serif" font-size="16">옮겨요. 몸에서 배로 잇는 선은 그리지 않아요</text><text x="15" y="448" font-family="sans-serif" font-size="16">.</text></g><g transform="translate(400,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D06 1번 예제 · 5 / 6</text><path d="M200 72 C135 72 100 169 100 258 C100 310 136 330 200 330" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 72 C265 72 300 169 300 258 C300 310 264 330 200 330" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 190 C163 190 134 214 134 245 C134 276 163 300 200 300 C237 300 266 276 266 245 C266 214 237 190 200 190" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="190" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 190 L175 190" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">배 위쪽에서 왼쪽으로 돌아요. 아래를 지나 오</text><text x="15" y="424" font-family="sans-serif" font-size="16">른쪽으로 올라와 배 위에서 닫아요.</text></g><g transform="translate(800,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D06 1번 예제 · 6 / 6</text><path d="M200 72 C135 72 100 169 100 258 C100 310 136 330 200 330" fill="no