<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="3.5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#bd530c"/></marker></defs><g transform="translate(0,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D03 1번 예제 · 1 / 6</text><circle cx="200" cy="120" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><text x="15" y="400" font-family="sans-serif" font-size="16">완성 예제에서 가장 큰 얼굴을 찾아요. 귀는 </text><text x="15" y="424" font-family="sans-serif" font-size="16">나중에 그려요. 위쪽 점을 짚어요.</text></g><g transform="translate(400,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D03 1번 예제 · 2 / 6</text><path d="M200 120 C133.724 120 80 164.77 80 220 C80 275.23 133.724 320 200 320" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="120" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 120 L170 120" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">얼굴 위쪽에서 왼쪽으로 둥글게 돌아 턱 아래까</text><text x="15" y="424" font-family="sans-serif" font-size="16">지 내려와요.</text></g><g transform="translate(800,0)"><text x="15" y="22" font-family="sans-serif" font-size="18">D03 1번 예제 · 3 / 6</text><path d="M200 120 C133.724 120 80 164.77 80 220 C80 275.23 133.724 320 200 320" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 120 C266.276 120 320 164.77 320 220 C320 275.23 266.276 320 200 320" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="120" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M200 120 L230 120" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">연필을 떼고 얼굴 위로 돌아와요. 이번에는 오</text><text x="15" y="424" font-family="sans-serif" font-size="16">른쪽으로 돌아 턱에서 만나요.</text></g><g transform="translate(0,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D03 1번 예제 · 4 / 6</text><path d="M200 120 C133.724 120 80 164.77 80 220 C80 275.23 133.724 320 200 320" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 120 C266.276 120 320 164.77 320 220 C320 275.23 266.276 320 200 320" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M102 162 C62 123 106 77 148 130" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="102" cy="162" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M102 162 L84 144" fill="none" stroke="#bd530c" stroke-width="2" marker-end="url(#arrow)"/><text x="15" y="400" font-family="sans-serif" font-size="16">왼쪽 귀의 아래 점에서 왼쪽 위로 올라가요. </text><text x="15" y="424" font-family="sans-serif" font-size="16">둥글게 돌아 얼굴 위쪽에 붙여요.</text></g><g transform="translate(400,560)"><text x="15" y="22" font-family="sans-serif" font-size="18">D03 1번 예제 · 5 / 6</text><path d="M200 120 C133.724 120 80 164.77 80 220 C80 275.23 133.724 320 200 320" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 120 C266.276 120 320 164.77 320 220 C320 275.23 266.276 320 200 320" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M102 162 C62 123 106 77 148 130" fill="none" stroke="#c5c1cf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 130 C294 77 338 123 298 162" fill="none" stroke="#7750c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="252" cy="130" r="5" fill="#bb510c" stroke="white" stroke-width="1.5"/><path d="M252 130 L270 110" fill="none" stroke="#bd530c" stroke